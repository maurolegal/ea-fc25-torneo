    <style>
        :root {
            --primary: #00fffc;
            --secondary: #ff00f7;
            --dark: #0c1020;
            --light: #f0f8ff;
            --accent: #ffcc00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Oxanium', sans-serif;
            background-color: var(--dark);
            color: var(--light);
            overflow-x: hidden;
            background: url('https://i.ibb.co/xtkw0mB7/background-de-fc-25.jpg') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(12, 16, 32, 0.85);
            z-index: -1;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: linear-gradient(135deg, rgba(0, 15, 30, 0.9) 0%, rgba(0, 0, 20, 0.95) 100%);
            backdrop-filter: blur(10px);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--primary);
            box-shadow: 0 0 20px rgba(0, 255, 252, 0.3);
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            height: 50px;
            transition: all 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
            filter: drop-shadow(0 0 10px var(--primary));
        }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
            font-family: 'Russo One', sans-serif;
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            display: block;
            width: 100%;
            padding-bottom: 15px;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 3px;
        }

        /* Estilos para el bracket */
        .bracket-container {
            background: rgba(10, 15, 40, 0.8);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            overflow-x: auto;
        }

        .brackets-wrapper {
            display: flex;
            gap: 0;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
            position: relative;
        }

        .group-bracket {
            flex: 1 1 0;
            min-width: 400px;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .bracket {
            display: flex;
            justify-content: space-between;
            min-width: 400px;
            padding: 20px 0;
        }

        .bracket.group-b {
            flex-direction: row-reverse;
        }

        .round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            width: 140px;
        }

        .round-title {
            color: var(--primary);
            font-size: 1.1rem;
            margin-bottom: 10px;
            text-align: center;
            font-family: 'Russo One', sans-serif;
        }

        .match {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
            min-height: 80px;
            position: relative;
        }

        .match::after {
            content: '';
            position: absolute;
            right: -20px;
            top: 50%;
            width: 20px;
            height: 2px;
            background: var(--primary);
        }

        .bracket.group-b .match::after {
            left: -20px;
            right: auto;
        }

        .team {
            display: flex;
            align-items: center;
            padding: 5px;
            margin: 5px 0;
            background: rgba(0, 255, 252, 0.1);
            border-radius: 4px;
        }

        .team img {
            width: 30px;
            height: 30px;
            margin-right: 10px;
        }

        .bracket.group-b .team img {
            margin-right: 0;
            margin-left: 10px;
        }

        .team-name {
            font-size: 0.9rem;
        }

        .score {
            margin-left: auto;
            font-weight: bold;
            color: var(--accent);
        }

        .final-bracket {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 200px;
            margin: 0 10px;
        }
        .cup-img {
            width: 100px !important;
            height: auto !important;
            display: block !important;
            margin: 0 auto 10px auto !important;
            z-index: 10 !important;
            background: none !important;
        }
        .bracket.final-round {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 220px;
            margin: 0 auto;
        }
        .bracket.final-round .round {
            width: 100%;
        }

        .group-title {
            color: var(--accent);
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 10px;
            font-family: 'Russo One', sans-serif;
        }

        /* Estilos para el generador de fixtures */
        .fixture-generator {
            background: rgba(10, 15, 40, 0.8);
            border-radius: 15px;
            padding: 20px;
            margin-top: 40px;
        }

    /* (Registro rápido eliminado) */
        .participants-card {
            background: rgba(10, 15, 40, 0.8);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(0,255,252,0.25);
            box-shadow: 0 0 20px rgba(0,255,252,0.12);
            margin-top: 25px;
        }
        .participants-list { display:grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
        .participant-item { background: rgba(0,0,0,0.45); border: 1px solid rgba(0,255,252,0.2); border-radius:8px; padding:10px; display:flex; align-items:center; gap:10px; }
        .participant-item img { width:28px; height:28px; object-fit:contain; }
    /* Estado de conexión Supabase */
    .sb-status { display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border-radius:999px; font-size:.85rem; border:1px solid rgba(0,255,252,0.3); background: rgba(0,0,0,0.35); }
    .sb-dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
    .sb-dot.pending { background:#ffcc00; box-shadow:0 0 8px #ffcc0077; }
    .sb-dot.ok { background:#00e676; box-shadow:0 0 8px #00e67688; }
    .sb-dot.err { background:#ff5252; box-shadow:0 0 8px #ff525288; }

        .fixture-controls {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .fixture-button {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: var(--dark);
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .fixture-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 252, 0.4);
        }

        .fixture-list {
            display: grid;
            gap: 15px;
        }

        .fixture-match {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--primary);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .fixture-team {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .fixture-team img {
            width: 40px;
            height: 40px;
        }

        .fixture-vs {
            color: var(--accent);
            font-weight: bold;
            padding: 0 20px;
        }

        .fixture-date {
            color: var(--primary);
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .brackets-wrapper {
                flex-direction: column;
                align-items: center;
            }
            .group-bracket, .final-bracket {
                max-width: 100vw;
            }
        }
    </style>

<body>

    <div class="container">
    <!-- Sección de registro rápido eliminada -->
        <section class="bracket-section">
            <h2 class="section-title">Bracket del Torneo</h2>
            <div class="bracket-container">
                <div class="brackets-wrapper">
                    <div class="group-bracket">
                        <h3 class="group-title">Grupo A</h3>

    <script>
        // Lista de equipos (con logos) para select y visuales
        const equiposChampions = [
            { nombre: "Real Madrid", logo: "https://i.ibb.co/twrzCVXf/real-madrid.png" },
            { nombre: "Barcelona", logo: "https://i.ibb.co/pjm42BkC/BARCELONA.png" },
            { nombre: "Bayern Múnich", logo: "https://i.ibb.co/mChM8rpX/BAYER.png" },

            { nombre: "Borussia Dortmund", logo: "https://i.ibb.co/HDzfMj9G/BORUSSIA.png" },

            { nombre: "Sevilla", logo: "https://i.ibb.co/N6jGQB4Y/SEVILLA.png" },
            { nombre: "RB Leipzig", logo: "https://i.ibb.co/HfDtRrKB/RB-LEIPZIONG.png" },
            { nombre: "Benfica", logo: "https://i.ibb.co/218WL3tN/BENFICA.png" },
            { nombre: "Porto", logo: "https://i.ibb.co/7f7rLHz/PORTO.png" },
            { nombre: "Ajax", logo: "https://i.ibb.co/bg7zDycy/AJAX.png" },
            { nombre: "Shakhtar Donetsk", logo: "https://i.ibb.co/VYRRn81p/SHAKHTAR.png" },
            { nombre: "Celtic", logo: "https://i.ibb.co/G30kNvRL/CELTIC.png" },
            { nombre: "Rangers", logo: "https://i.ibb.co/DfD0247k/RANGER.png" },
            { nombre: "Galatasaray", logo: "https://i.ibb.co/dsnW08bR/GALATASARAY.png" },
            { nombre: "Fenerbahçe", logo: "https://i.ibb.co/Q3S0BN82/FENERBA.png" },
            { nombre: "Olympiakos", logo: "https://i.ibb.co/zhGvQGwy/Olympiacos.png" },
            { nombre: "Dinamo Kiev", logo: "https://i.ibb.co/BKHd0fQ2/DINAMO-KIEV.png" },
            { nombre: "Red Bull Salzburg", logo: "https://i.ibb.co/5hn4v5Gp/Red-Bull-Salzburg.png" },
            { nombre: "Sporting de Lisboa", logo: "https://i.ibb.co/JW8msbgK/Sporting-de-Lisboa.png" },
            { nombre: "PSV Eindhoven", logo: "https://i.ibb.co/HLZKbrBc/25.png" },
            { nombre: "Napoli", logo: "https://i.ibb.co/1tYXmWYT/Napoli.png" },
            { nombre: "Roma", logo: "https://i.ibb.co/gZL9cdDb/Roma.png" },
            { nombre: "Lazio", logo: "https://i.ibb.co/gM2BJQQN/Lazio.png" },
            { nombre: "Copenhague", logo: "https://i.ibb.co/5WBwS3RD/29.png" }
        ];

        function logoEquipo(nombreEquipo){
            const e = equiposChampions.find(x => x.nombre === nombreEquipo);
            return e ? e.logo : 'https://i.ibb.co/xtkw0mB7/background-de-fc-25.jpg';
        }

    // (Lógica de conteos y formulario rápido eliminada; mantenemos solo lectura de participantes)

        // Cargar participantes
        async function cargarParticipantes() {
            try {
                const { data, error } = await supabase
                    .from('registrations')
                    .select('*')
                    .order('created_at', { ascending: true });
                if (error) throw error;
                return data || [];
            } catch (e) {
                console.error('Error al cargar participantes:', e);
                return [];
            }
        }

    function renderParticipantsList(participantes) {
            const container = document.getElementById('participants-list');
            if (!container) return;
            container.innerHTML = '';
            participantes.forEach(p => {
                const item = document.createElement('div');
                item.className = 'participant-item';
                item.innerHTML = `
                    <img src="${logoEquipo(p.equipo)}" alt="${p.equipo}">
            <div style="font-weight:700;">${p.nombre} — <span style="font-weight:600;color:#cde;">${p.equipo}</span></div>
                `;
                container.appendChild(item);
            });
        }

        // Función para generar el bracket
        function generarBracket(participantes) {
            // Dividir participantes en dos grupos lo más parejo posible
            const mitad = Math.ceil(participantes.length / 2);
            const grupoA = participantes.slice(0, mitad);
            const grupoB = participantes.slice(mitad);

            // Generar brackets para cada grupo de forma dinámica
            generarBracketGrupo('group-a-bracket', grupoA, 'A', false);
            generarBracketGrupo('group-b-bracket', grupoB, 'B', true);
            generarBracketFinal();
        }

        // Calcula las rondas necesarias para un grupo según la cantidad de participantes
        function calcularRondas(numParticipantes) {
            const rondas = [];
            let partidos = Math.pow(2, Math.floor(Math.log2(numParticipantes)));
            while (partidos >= 2) {
                rondas.push(partidos);
                partidos = partidos / 2;
            }
            return rondas;
        }

        function generarBracketGrupo(containerId, participantes, grupo, invertido = false) {
            const bracket = document.getElementById(containerId);
            bracket.innerHTML = '';

            // Calcular rondas necesarias según la cantidad de participantes
            const rondas = calcularRondas(participantes.length);
            if (invertido) rondas.reverse(); // Para grupo B, invertir el orden visual

            rondas.forEach((numPartidos, index) => {
                const round = document.createElement('div');
                round.className = 'round';
                round.innerHTML = `<h3 class=\"round-title\">${!invertido ?
                    (index === rondas.length - 1 ? 'Final Grupo ' + grupo :
                    index === rondas.length - 2 ? 'Semifinales' :
                    index === rondas.length - 3 ? 'Cuartos' :
                    index === rondas.length - 4 ? 'Octavos' :
                    `Ronda`)
                    :
                    (index === 0 ? 'Final Grupo ' + grupo :
                    index === 1 ? 'Semifinales' :
                    index === 2 ? 'Cuartos' :
                    index === 3 ? 'Octavos' :
                    `Ronda`)
                }</h3>`;

                for (let i = 0; i < numPartidos; i++) {
                    const match = document.createElement('div');
                    match.className = 'match';
                    // Primera ronda con participantes reales (emparejamiento p1 vs p2)
                    if ((!invertido && index === 0) || (invertido && index === rondas.length - 1)) {
                        const p1 = participantes[2 * i];
                        const p2 = participantes[2 * i + 1];
                        if (p1 || p2) {
                            match.innerHTML = `
                                <div class=\"team\">
                                    <img src=\"${obtenerLogoEquipo(p1?.equipo || '')}\" alt=\"${p1?.equipo || 'Libre'}\">
                                    <span class=\"team-name\">${p1 ? `${p1.nombre} — ${p1.equipo}` : 'Libre'}</span>
                                </div>
                                <div class=\"team\">
                                    <img src=\"${obtenerLogoEquipo(p2?.equipo || '')}\" alt=\"${p2?.equipo || 'Libre'}\">
                                    <span class=\"team-name\">${p2 ? `${p2.nombre} — ${p2.equipo}` : 'BYE'}</span>
                                </div>
                            `;
                        } else {
                            match.innerHTML = `
                                <div class=\"team\"><span class=\"team-name\">Pendiente</span></div>
                                <div class=\"team\"><span class=\"team-name\">vs</span></div>
                            `;
                        }
                    } else {
                        // Partidos vacíos para las siguientes rondas
                        match.innerHTML = `
                            <div class=\"team\">
                                <span class=\"team-name\">Pendiente</span>
                            </div>
                            <div class=\"team\">
                                <span class=\"team-name\">vs</span>
                            </div>
                        `;
                    }
                    round.appendChild(match);
                }
                bracket.appendChild(round);
            });
        }

        function generarBracketFinal() {
            const bracket = document.getElementById('final-bracket');
            bracket.innerHTML = '';

            const round = document.createElement('div');
            round.className = 'round final-round';
            round.innerHTML = `<h3 class="round-title">Final del Torneo</h3>`;

            const match = document.createElement('div');
            match.className = 'match';
            match.innerHTML = `
                <div class="team">
                    <span class="team-name">Ganador Grupo A</span>
                </div>
                <div class="team">
                    <span class="team-name">vs</span>
                </div>
                <div class="team">
                    <span class="team-name">Ganador Grupo B</span>
                </div>
            `;

            round.appendChild(match);
            bracket.appendChild(round);
        }

    // Función para obtener el logo del equipo
    function obtenerLogoEquipo(nombreEquipo) { return logoEquipo(nombreEquipo); }

        // Función para generar fixtures aleatorios
        function generarFixtures(participantes) {
            const fixtureList = document.getElementById('fixture-list');
            fixtureList.innerHTML = '';

            // Mezclar participantes aleatoriamente
            const participantesMezclados = [...participantes].sort(() => Math.random() - 0.5);

            // Generar partidos
            for (let i = 0; i < participantesMezclados.length; i += 2) {
                if (i + 1 < participantesMezclados.length) {
                    const fixture = document.createElement('div');
                    fixture.className = 'fixture-match';
                    
                    const participante1 = participantesMezclados[i];
                    const participante2 = participantesMezclados[i + 1];

                    fixture.innerHTML = `
                        <div class="fixture-team">
                            <img src="${obtenerLogoEquipo(participante1.equipo)}" alt="${participante1.equipo}">
                            <span>${participante1.nombre}</span>
                        </div>
                        <div class="fixture-vs">VS</div>
                        <div class="fixture-team">
                            <img src="${obtenerLogoEquipo(participante2.equipo)}" alt="${participante2.equipo}">
                            <span>${participante2.nombre}</span>
                        </div>
                        <div class="fixture-date">Fecha por definir</div>
                    `;

                    fixtureList.appendChild(fixture);
                }
            }
        }

        let participantesGlobal = [];
        async function actualizarEstadoSupabase(estado, detalle) {
            const dot = document.getElementById('sb-dot');
            const text = document.getElementById('sb-text');
            if (!dot || !text) return;
            if (estado === 'ok') { dot.className = 'sb-dot ok'; text.textContent = 'Conectado a Supabase'; }
            else if (estado === 'err') { dot.className = 'sb-dot err'; text.textContent = detalle || 'Error de conexión a Supabase'; }
            else { dot.className = 'sb-dot pending'; text.textContent = 'Conectando a Supabase…'; }
        }

        async function probarConexionSupabase() {
            try {
                const { error } = await supabase.from('team_counts').select('team_name').limit(1);
                if (error) throw error;
                await actualizarEstadoSupabase('ok');
