<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro Torneo - Escanea el QR</title>
  <meta name="description" content="Escanea el código QR para registrarte en el torneo." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600;900&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark light;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Roboto', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0f17;
      background-image: radial-gradient(circle at 30% 30%, #1c2538, transparent 60%), radial-gradient(circle at 70% 70%, #182132, transparent 55%);
      color: #fff;
      overflow: hidden;
    }
    .wrapper {
      text-align: center;
      max-width: 1000px;
      padding: 2rem 1.5rem 3rem;
      width: 100%;
    }
    h1 { margin: 0 0 1rem; font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 900; letter-spacing: .5px; }
    p { margin: .25rem 0 1.5rem; font-size: clamp(.95rem, 1.6vw, 1.15rem); line-height: 1.4; }
    .qr-container {
      position: relative;
      margin: 0 auto;
      width: min(78vmin, 680px);
      aspect-ratio: 1 / 1;
      background: #fff;
      border-radius: 24px;
      padding: clamp(14px, 2.4vmin, 28px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 40px -10px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08) inset;
      isolation: isolate;
    }
    canvas, img.qr-fallback { width: 100%; height: 100%; object-fit: contain; }
    .note { opacity: .75; font-size: .85rem; margin-top: 1.25rem; }
    a.fallback-link { color: #4da6ff; font-weight: 600; text-decoration: none; }
    a.fallback-link:hover { text-decoration: underline; }
    footer { position: fixed; bottom: .6rem; left: 0; right: 0; text-align: center; font-size: .65rem; letter-spacing: .5px; opacity: .4; }

    /* Animaciones sutiles */
    .qr-container::after, .qr-container::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
    }
    .qr-container::before { border: 2px solid rgba(0,0,0,.05); mix-blend-mode: overlay; }
    .qr-container::after {
      background: linear-gradient(115deg, rgba(77,166,255,.15), transparent 60%);
      mix-blend-mode: overlay;
      animation: sheen 4.8s linear infinite;
    }
    @keyframes sheen { 0% { opacity: 0; } 8% { opacity: 1; } 40% { opacity: .25; } 60% { opacity: 0; } 100% { opacity: 0; } }

    @media (max-width: 560px) {
      body { padding: 0; }
      .wrapper { padding-top: 1.25rem; }
      h1 { font-size: 1.75rem; }
      .qr-container { border-radius: 18px; }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>Registro Torneo EA FC 25</h1>
    <p>Escanea este código con tu celular para abrir la página de registro y asegurar tu lugar en el torneo.</p>
    <div class="qr-container" id="qrBox" aria-label="Código QR hacia la página de registro" role="img"></div>
    <p class="note">Si tu cámara no reconoce el código, entra aquí: <br><a class="fallback-link" id="directLink" href="https://torneos.nemesisxpert.com/index.html">https://torneos.nemesisxpert.com/index.html</a></p>
  </div>
  <footer>© <span id="year"></span> Torneo EA FC 25</footer>

  <!-- Librería QRCode.js desde CDN confiable -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha512-J7V6Rj2PpT1rkSdkT1GN9VOGBev5nYeD1yfknhk+aoCA8DmF5asJ5AZt0pOEtpJR/YKZ7RkJ3sJrX+4VQWqY3g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    (function () {
      // Construir URL destino de forma robusta (si se sirve bajo el dominio configurado usará ese host)
      const absoluteBase = window.location.origin.includes('localhost') ? 'https://torneos.nemesisxpert.com' : window.location.origin;
      const targetUrl = absoluteBase.replace(/\/$/, '') + '/index.html';
      const linkEl = document.getElementById('directLink');
      linkEl.href = targetUrl;
      linkEl.textContent = targetUrl;
      document.getElementById('year').textContent = new Date().getFullYear();

      const box = document.getElementById('qrBox');
      box.innerHTML = '';
      try {
        const size = Math.min(window.innerWidth, window.innerHeight) * 0.80; // 80% del menor lado
        const qrDiv = document.createElement('div');
        box.appendChild(qrDiv);
        new QRCode(qrDiv, {
          text: targetUrl,
          width: Math.round(size),
            height: Math.round(size),
          colorDark: '#000000',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.H
        });
      } catch (e) {
        console.error('Error generando QR principal', e);
        const img = document.createElement('img');
        img.className = 'qr-fallback';
        img.alt = 'Código QR hacia registro';
        img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=800x800&data=' + encodeURIComponent(targetUrl);
        box.appendChild(img);
      }

      // Regenerar al cambiar orientación / tamaño para mantener lo grande posible
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          // volver a generar
          box.innerHTML = '';
          try {
            const size = Math.min(window.innerWidth, window.innerHeight) * 0.80;
            const qrDiv = document.createElement('div');
            box.appendChild(qrDiv);
            new QRCode(qrDiv, { text: targetUrl, width: Math.round(size), height: Math.round(size), colorDark: '#000', colorLight: '#fff', correctLevel: QRCode.CorrectLevel.H });
          } catch (_) { /* ignorar */ }
        }, 180);
      });
    })();
  </script>
  <noscript>
    <div style="text-align:center;margin-top:1rem;font:14px system-ui;color:#fff;">
      <p>Activa JavaScript para ver el código QR. Entra al registro aquí:<br>
      <a href="https://torneos.nemesisxpert.com/index.html" style="color:#4da6ff;">https://torneos.nemesisxpert.com/index.html</a></p>
    </div>
  </noscript>
</body>
</html>
